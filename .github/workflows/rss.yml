name: Generate JW.org HR RSS

on:
  # Scheduled cloud runs are disabled: JW.org serves an empty page to
  # datacenter/cloud IPs (GitHub Actions), so the scraper finds zero items.
  # This project is deprecated in favour of JW.org's official RSS feed:
  #   https://www.jw.org/hr/sto-je-novo/rss/WhatsNewWebArticles/feed.xml
  # Kept for manual/testing use only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python generate_rss.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain jw_hr.xml)" ]; then
            git add jw_hr.xml
            git commit -m "Update RSS feed"
            git push
          else
            echo "No changes to the feed."
          fi
